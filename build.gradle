apply plugin: 'java'

repositories {
  mavenCentral()
}

// Deployed on the Lambda java21 runtime.
tasks.withType(JavaCompile).configureEach {
  options.release = 21
}

dependencies {
  implementation platform('software.amazon.awssdk:bom:2.31.0')

  implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
  implementation 'com.amazonaws:aws-lambda-java-events:3.14.0'
  implementation('software.amazon.awssdk:dynamodb') {
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
  }
  implementation('software.amazon.awssdk:sesv2') {
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
  }
  // The lightest HTTP client for the SDK, which keeps cold starts down.
  implementation 'software.amazon.awssdk:url-connection-client'
  implementation 'com.google.code.gson:gson:2.11.0'
  implementation 'com.google.guava:guava:33.3.1-jre'
  implementation 'com.nimbusds:nimbus-jose-jwt:10.5'

  // These dependencies are only used by the tests.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'com.google.truth:truth:1.1.3'
}

// The Lambda's code: classes at the root, dependencies under lib/. aws/lib/app-stack.js deploys this zip.
tasks.register('buildZip', Zip) {
  archiveFileName = 'secretsanta-lambda.zip'
  destinationDirectory = layout.buildDirectory.dir('distributions')
  from compileJava
  from processResources
  into('lib') {
    from configurations.runtimeClasspath
  }
}

// Runs the API locally on http://localhost:8080, which `yarn dev` in flyte-frontend points /secretsanta at.
// SANTA_DRY_RUN=true keeps runs in memory, logs emails and accepts the page's mock sign-in tokens.
tasks.register('runFunction', JavaExec) {
  mainClass = 'jaerapps.functions.generateNames.LocalServer'
  classpath = sourceSets.main.runtimeClasspath
}
